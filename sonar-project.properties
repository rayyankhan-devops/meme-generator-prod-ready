# =====================================================================
# SonarQube / SonarCloud Project Configuration
# Project: Meme Generator (React Frontend + Node.js Backend)
# =====================================================================

# Unique Project Key & Information
sonar.projectKey=rayyankhan-devops_meme-generator-prod-ready
sonar.projectName=Meme Generator (Production Ready)
sonar.projectVersion=1.0.0

# Source Code Locations
sonar.sources=frontend/src,backend

# Unit & Integration Tests Locations
sonar.tests=frontend/src,backend/test
sonar.test.inclusions=frontend/src/**/*.test.jsx,frontend/src/**/*.spec.jsx,backend/test/**/*.test.js

# Exclude generated artifacts, node_modules, images, and SQL init scripts from scanning
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/images/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.svg,**/init/mysql/**

# Encoding
sonar.sourceEncoding=UTF-8

# Test Coverage Reports (LCOV)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
