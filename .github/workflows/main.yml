name: MemeApp-CICD
on: workflow_dispatch

jobs:
  Build-Run-And-check-linting:
    runs-on: ubuntu-latest
    steps:
      - name: cloning-code
        uses: actions/checkout@v4.4.0

      - name: setup-Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"

      - name: Installing-dep-at-backend-and-frontend
        run: |
          cd backend
          npm i
          cd ..
          cd frontend
          npm i
          cd ..

      - name: running-lint
        run: |
          cd backend
          npm run lint
          cd ..
          cd frontend
          npm run lint
          cd ..

      - name: testing-BackAndFrontEnd
        run: |
          cd backend
          npm run test
          cd ..
          cd frontend
          npm run test
          cd ..

  Building-images:
    runs-on: ubuntu-latest
    needs:
      - Build-Run-And-check-linting
    steps:
      - name: cloning-code
        uses: actions/checkout@v4.4.0

      - name: Login-to-Docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

          
      
    
