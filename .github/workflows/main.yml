name: Meme-Generator-CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    lint:
        uses: ./.github/workflows/lint.yml
    
    secret-scanning:
        needs: [lint]
        uses: ./.github/workflows/secret-scan.yml
    
    dep-scanning:
        needs: [lint,secret-scanning]
        uses: ./.github/workflows/dep-check.yml

