name: secret-scanning

on:
    workflow_call:

jobs:
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: code cloning
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
        
            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@v3 
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}