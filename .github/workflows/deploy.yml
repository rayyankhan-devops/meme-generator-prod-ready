name: Continuous-Deployment

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote EC2 Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.SERVER_HOST != '' || secrets.HOST_IP != '' }}
        with:
          host: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_HOST || secrets.HOST_IP }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on EC2 Instance..."
            
            TARGET_DIR="${{ secrets.TARGET_DIR || '~/meme-generator' }}"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            # Login to Docker Hub
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
            fi
            
            # Pull latest production images or rebuild without cache
            echo "📦 Deploying containers with Docker Compose..."
            docker compose pull || docker compose build --no-cache
            docker compose up -d --force-recreate --remove-orphans
            
            echo "✅ Verifying running services..."
            docker compose ps
            
            # Clean up unused Docker images
            docker image prune -f

      - name: Self-Hosted Runner Local Deployment
        if: ${{ secrets.SERVER_HOST == '' && secrets.HOST_IP == '' }}
        run: |
          echo "🚀 Performing local Docker Compose deployment..."
          docker compose pull || docker compose build --no-cache
          docker compose up -d --force-recreate --remove-orphans
          echo "✅ Verifying service status..."
          docker compose ps